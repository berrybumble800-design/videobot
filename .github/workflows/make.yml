name: make
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: topic
        required: true
      chat_id:
        description: telegram chat id
        required: true
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      MODEL: ${{ secrets.MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CHAT_ID: ${{ inputs.chat_id }}
      IDEA: ${{ inputs.prompt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          pip install numpy Pillow requests
          npm install -g opencode-ai
      - name: Prepare studio
        run: |
          cp -r .claude/skills/what-if-animation/studio ./what-if-studio
          cd what-if-studio
          npm install
          npx remotion browser ensure
          cd ..
          printf 'ELEVENLABS_API_KEY=%s\n' "$ELEVENLABS_API_KEY" > .env
      - name: Make episode
        run: |
          timeout 100m opencode run --model "$MODEL" "Load the what-if-animation skill and follow it. Nobody is watching, so do not wait for approval and run every step to the end. Make a What If episode: $IDEA"
      - name: Send result
        if: always()
        run: |
          F=$(find what-if-studio/out -name '*-final.mp4' 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            ffmpeg -y -i "$F" -vf scale=-2:720 -c:v libx264 -crf 27 -c:a aac -b:a 96k small.mp4
            curl -s -F chat_id="$CHAT_ID" -F video=@small.mp4 "https://api.telegram.org/bot$BOT_TOKEN/sendVideo"
          else
            curl -s "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" -d chat_id="$CHAT_ID" -d text="No video was made. Details: $RUN_URL"
          fi
